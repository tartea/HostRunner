<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with simple shadow (compatible circle behind) -->
  <circle cx="66" cy="66" r="60" fill="#000000" opacity="0.15"/>
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>

  <!-- Host/Server icon (central element) -->
  <g transform="translate(32, 28)">
    <!-- Server/Host representation -->
    <rect x="0" y="20" width="64" height="40" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="8" y="28" width="48" height="4" rx="2" fill="#4A90E2" opacity="0.7"/>
    <rect x="8" y="36" width="32" height="4" rx="2" fill="#4A90E2" opacity="0.5"/>
    <rect x="8" y="44" width="40" height="4" rx="2" fill="#4A90E2" opacity="0.6"/>

    <!-- Server lights/status indicators -->
    <circle cx="52" cy="30" r="2" fill="#50C878"/>
    <circle cx="52" cy="38" r="2" fill="#FFD700"/>
    <circle cx="52" cy="46" r="2" fill="#FF6B6B"/>
  </g>

  <!-- Network/Connection lines -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <!-- Connection lines representing network/hosts connections -->
    <line x1="20" y1="30" x2="45" y2="40" />
    <line x1="20" y1="60" x2="45" y2="52" />
    <line x1="108" y1="30" x2="83" y2="40" />
    <line x1="108" y1="60" x2="83" y2="52" />

    <!-- Top connection lines -->
    <line x1="35" y1="15" x2="52" y2="24" />
    <line x1="93" y1="15" x2="76" y2="24" />
  </g>

  <!-- Network nodes (representing different hosts/environments) -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="15" cy="30" r="4"/>
    <circle cx="15" cy="60" r="4"/>
    <circle cx="113" cy="30" r="4"/>
    <circle cx="113" cy="60" r="4"/>
    <circle cx="35" cy="10" r="4"/>
    <circle cx="93" cy="10" r="4"/>
  </g>

  <!-- Switch/Configuration indicator -->
  <g transform="translate(48, 75)">
    <!-- Switch toggle representing configuration switching -->
    <rect x="0" y="0" width="32" height="12" rx="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="24" cy="6" r="4" fill="#50C878"/>
    <!-- Switch label -->
    <text x="16" y="-5" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" opacity="0.9">SW</text>
  </g>

  <!-- Corner decorations for environments -->
  <g fill="#FFFFFF" opacity="0.6">
    <!-- Dev indicator -->
    <circle cx="20" cy="100" r="3" fill="#50C878"/>
    <text x="28" y="104" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF">DEV</text>

    <!-- Test indicator -->
    <circle cx="64" cy="108" r="3" fill="#FFD700"/>
    <text x="72" y="112" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF">TEST</text>

    <!-- Prod indicator -->
    <circle cx="108" cy="100" r="3" fill="#FF6B6B"/>
    <text x="88" y="104" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="end">PROD</text>
  </g>
</svg>